name: Data-independent quality gates
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
      - run: npm ci
      - run: cd analysis && uv sync --locked
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: cd analysis && uv run ruff check src tests && uv run ruff format --check src tests && uv run mypy && uv run pytest
      - name: Start Firestore Emulator
        run: docker run -d --name firestore -p 127.0.0.1:8080:8080 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=demo-food-access --quiet
      - name: Wait for emulator
        run: for attempt in {1..60}; do if curl -s http://127.0.0.1:8080/ >/dev/null; then exit 0; fi; sleep 1; done; exit 1
      - run: npm run test:coverage
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          GOOGLE_CLOUD_PROJECT: demo-food-access
      - if: always()
        run: docker rm -f firestore
      # Real-data production builds and browser tests run on the data-holding machine.
      # No raw/processed datasets, notebooks, or data fixtures are uploaded as artifacts.

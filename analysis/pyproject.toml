[project]
name = "food-access-analysis"
version = "0.1.0"
description = "Local, deterministic Central Florida food-access data preparation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas>=2.3,<3", "duckdb>=1.4,<2", "pyshp>=3,<4", "shapely>=2.1,<3",
  "pyproj>=3.7,<4", "nbformat>=5.10,<6", "nbclient>=0.10,<1",
  "ipykernel>=6.30,<8", "matplotlib>=3.10,<4"
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "hypothesis>=6.140,<7", "ruff>=0.14,<1", "mypy>=1.18,<2", "pandas-stubs>=2.3,<3"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
untyped_calls_exclude = ["nbformat"]
files = ["src"]
[[tool.mypy.overrides]]
module = ["shapefile", "shapely.*", "pyproj.*", "duckdb", "nbformat.*", "nbclient.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-report=html --cov-report=json --cov-fail-under=100"
